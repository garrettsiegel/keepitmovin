name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-lint:
    name: Build, test, lint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # node-pty is the whole point of the harness. It has no Linux prebuild, so
      # without an approved build script CI would silently exercise the degraded
      # pipe fallback and every PTY behavior would go untested.
      - name: Assert node-pty built (no silent pipe fallback)
        run: node -e "require('node-pty'); console.log('node-pty loaded')"

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint (typechecks src and test)
        run: pnpm lint

      - name: Coverage
        if: matrix.node == 22
        run: pnpm test:coverage

  site:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: site
        run: pnpm build
