name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-lint:
    name: Build, lint, smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        # macOS is where node-pty's spawn-helper exec bit breaks under pnpm
        # (pty/helper.ts self-heals it), so it gets one leg of its own.
        include:
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # node-pty is the whole point of the harness. It has no Linux prebuild, so
      # without an approved build script CI would silently exercise the degraded
      # pipe fallback and break PTY behavior at runtime.
      - name: Assert node-pty built (no silent pipe fallback)
        run: node -e "require('node-pty'); console.log('node-pty loaded')"

      - name: Build
        run: pnpm build

      - name: Lint (typechecks src)
        run: pnpm lint

      # There is no test suite, so these prove the built CLI actually runs.
      - name: Smoke - CLI starts
        run: |
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null

      # Parses the example config end to end. No agent tools exist on the
      # runner, so doctor's verdict is irrelevant — only that it got that far.
      - name: Smoke - doctor parses the example config
        run: |
          out=$(node dist/cli.js doctor -c keepitmovin.config.example.json 2>&1) || true
          echo "$out"
          grep -q "Sessions dir:" <<< "$out"

      - name: Smoke - MCP handshake
        run: node scripts/smoke-mcp.mjs < /dev/null

      - name: Smoke - package contents
        run: npm pack --dry-run 2>&1 | tee pack.txt && grep -q "dist/cli.js" pack.txt

  site:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: site
        run: pnpm build
