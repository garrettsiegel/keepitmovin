name: release

# Publishing previously ran from a laptop with a long-lived npm session, which
# left no provenance and made a release reproducible on exactly one machine.
# Pushing a tag now builds, verifies and publishes from a clean checkout.
#
# Authentication uses npm **trusted publishing**: npm is configured to trust this
# specific repository + workflow, and GitHub mints a short-lived OIDC token for
# each run. There is no npm token stored anywhere in this repo, so there is
# nothing to leak, rotate, or accidentally grant to a fork.
#
# One-time setup on npmjs.com (Package → Settings → Trusted Publisher):
#   Organization or user: garrettsiegel
#   Repository:           keepitmovin
#   Workflow filename:    release.yml
#   Environment:          (leave blank)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets GitHub mint the OIDC token npm exchanges for short-lived publish
      # rights. Without this the publish step cannot authenticate at all.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 still ships npm 10.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert node-pty built (no silent pipe fallback)
        run: node -e "require('node-pty'); console.log('node-pty loaded')"

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      # A tag that disagrees with package.json would publish the wrong version.
      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      # No NODE_AUTH_TOKEN: credentials come from the OIDC exchange above.
      # Provenance is attached automatically under trusted publishing.
      - name: Publish
        run: npm publish --access public
