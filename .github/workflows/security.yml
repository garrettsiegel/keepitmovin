name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Mondays 08:00 UTC — catches advisories published after merge.
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit + licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (fail on high+)
        run: pnpm audit --prod --audit-level high

      - name: List dependency licenses (informational, never fails)
        run: pnpm licenses list --prod || true

      # site/ is a second, independent dependency tree that the root audit misses.
      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      # Informational, unlike the package audit above. site/ is the static
      # marketing site, not the published artifact, and it currently carries
      # Astro advisories (reflected XSS via slot name, host-header SSRF in the
      # prerendered error page) that are only patched in Astro >= 6.4.6. Both are
      # SSR-shaped issues and this site is `output: "static"`, so the practical
      # exposure is low. Moving to Astro 7 also needs a fix to
      # site/src/pages/changelog.astro, which resolves ../../../CHANGELOG.md from
      # import.meta.url — Astro 7 bundles the page elsewhere and that path breaks.
      # Tracked by the Dependabot astro PR; make this blocking again once merged.
      - name: Audit site dependencies (informational)
        working-directory: site
        run: pnpm audit --prod --audit-level high || true
