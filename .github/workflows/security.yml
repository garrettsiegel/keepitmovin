name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Mondays 08:00 UTC — catches advisories published after merge.
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit + licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (fail on high+)
        run: pnpm audit --prod --audit-level high

      - name: List dependency licenses (informational, never fails)
        run: pnpm licenses list --prod || true

      # site/ is a second, independent dependency tree that the root audit misses.
      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Audit site dependencies (fail on high+)
        working-directory: site
        run: pnpm audit --prod --audit-level high
