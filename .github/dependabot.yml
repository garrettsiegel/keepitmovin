version: 2

updates:
  # Root CLI package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # @types/node must track the oldest Node this package supports
      # (engines: >=22.12), not the newest types available — otherwise tsc
      # accepts APIs that are missing on the runtime users actually have.
      # Raise this deliberately alongside an engines bump.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development

  # site/ is a separate dependency tree with its own lockfile, so it needs its
  # own entry — the root ecosystem never sees it.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
